version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - gosec
    - unparam
    - unused
    - gocritic
    - bodyclose
    - contextcheck
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    - misspell

  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
        - name: if-return
        - name: empty-block
        - name: superfluous-else
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofumpt
